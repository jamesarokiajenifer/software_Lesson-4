'use strict';
const QUESTIONS = [{"id":1,"round":1,"tag":"Types of Software","difficulty":"Easy","question":"Which of the following is application software?","choices":["Microsoft Excel","Microsoft Windows","A printer driver","BIOS firmware"],"correct":[0],"why":"Excel is application software used for spreadsheets. Windows, device drivers and BIOS are system-level software or firmware.","kind":"single"},{"id":2,"round":1,"tag":"Utilities","difficulty":"Easy","question":"Which utility detects and quarantines suspected malware?","choices":["Backup software","Antivirus software","Disk defragmenter","File compression utility"],"correct":[1],"why":"Antivirus software scans for malicious software and may quarantine suspicious files.","kind":"single"},{"id":3,"round":1,"tag":"Utilities","difficulty":"Easy","question":"How can defragmentation improve the performance of a traditional HDD?","choices":["It increases disk capacity","It changes the HDD into an SSD","It reduces unnecessary read/write head movement","It places the OS in ROM"],"correct":[2],"why":"Defragmentation rearranges scattered file data on a mechanical HDD, potentially reducing head movement. It is generally not needed for SSDs.","kind":"single"},{"id":4,"round":1,"tag":"User Interfaces","difficulty":"Easy","question":"A technician enters a text command in a terminal to list files. Which interface is used?","choices":["Graphical User Interface","Voice interface","Touchscreen-only interface","Command Line Interface"],"correct":[3],"why":"A CLI takes typed commands such as dir or ls.","kind":"single"},{"id":5,"round":1,"tag":"User Interfaces","difficulty":"Easy","question":"Why might a beginner prefer a GUI rather than a CLI?","choices":["It offers icons and menus instead of memorising commands","It always uses less RAM","It does not require an OS","It prevents all mistakes"],"correct":[0],"why":"A GUI makes common actions easier through visual elements such as icons, menus and windows.","kind":"single"},{"id":6,"round":1,"tag":"Memory Management","difficulty":"Easy","question":"Chrome, a game and a word processor are open. Which OS function allocates RAM to their processes?","choices":["File management","Memory management","User account management","Printer management"],"correct":[1],"why":"The OS uses memory management to track which regions of RAM are being used and to allocate memory to processes.","kind":"single"},{"id":7,"round":1,"tag":"Multitasking","difficulty":"Easy","question":"On a single-core CPU, how can several applications appear to run together?","choices":["All applications run from ROM","Every application gets a separate physical CPU","The OS switches CPU time between processes","Programs execute only after all others close"],"correct":[2],"why":"Rapid context switching between runnable processes allows time-sharing on one CPU core.","kind":"single"},{"id":8,"round":1,"tag":"Device Drivers","difficulty":"Easy","question":"Which software allows an operating system to communicate with a newly connected printer?","choices":["Spreadsheet software","Backup utility","Disk defragmenter","Device driver"],"correct":[3],"why":"A device driver provides the interface between the OS and specific hardware.","kind":"single"},{"id":9,"round":1,"tag":"Buffers","difficulty":"Easy","question":"What is the purpose of a print buffer?","choices":["Temporarily hold data awaiting printing","Permanently archive every print job","Physically accelerate the printer motor","Convert documents into assembly"],"correct":[0],"why":"A buffer temporarily stores data while a slower device processes it.","kind":"single"},{"id":10,"round":1,"tag":"User Accounts","difficulty":"Easy","question":"A student cannot install software for every user, but an administrator can. Which OS responsibility manages this?","choices":["Multitasking","User account management","Disk defragmentation","Print buffering"],"correct":[1],"why":"The OS manages accounts, access rights and permissions.","kind":"single"},{"id":11,"round":1,"tag":"File Management","difficulty":"Easy","question":"A student creates a folder and moves a document into it. Which OS function is mainly involved?","choices":["CPU scheduling","Interrupt prioritisation","File management","Memory paging"],"correct":[2],"why":"Creating directories and moving files are file-management operations.","kind":"single"},{"id":12,"round":1,"tag":"Security","difficulty":"Easy","question":"A program blocks unauthorised incoming connections based on network security rules. What is it?","choices":["Compiler","File explorer","Print spooler","Firewall"],"correct":[3],"why":"A firewall monitors network traffic and applies configured allow/block rules.","kind":"single"},{"id":13,"round":1,"tag":"Backup","difficulty":"Easy","question":"What is the best protection against permanently losing a project file after an accidental deletion?","choices":["Keep a separate backup","Increase screen brightness","Rename its folder","Change keyboard language"],"correct":[0],"why":"A separate backup can be restored if the original data is deleted or damaged.","kind":"single"},{"id":14,"round":1,"tag":"Booting","difficulty":"Easy","question":"What does BIOS/UEFI firmware help to do when a computer is switched on?","choices":["Write homework documents","Initialise hardware and start the boot process","Play every installed game","Replace the operating system"],"correct":[1],"why":"BIOS/UEFI prepares essential hardware and initiates the process of starting the operating system.","kind":"single"},{"id":15,"round":1,"tag":"RAM","difficulty":"Easy","question":"Where are operating-system instructions needed for execution normally loaded during startup?","choices":["Inside the monitor","Inside a printer buffer","Into RAM","Permanently into a keyboard"],"correct":[2],"why":"The running operating system requires instructions and data to be loaded into main memory (RAM).","kind":"single"},{"id":16,"round":1,"tag":"Virtual Memory","difficulty":"Easy","question":"How can virtual memory help when physical RAM is insufficient?","choices":["It automatically installs RAM modules","It uses only CPU arithmetic registers","It replaces RAM with the display","It stores some memory pages on secondary storage"],"correct":[3],"why":"Virtual memory lets the OS manage a larger virtual address space and move some pages between RAM and a backing store.","kind":"single"},{"id":17,"round":1,"tag":"Scheduling","difficulty":"Easy","question":"A low-priority process waits indefinitely while others keep getting CPU time. What is this called?","choices":["Starvation","Defragmentation","Spooling","Bootstrapping"],"correct":[0],"why":"Starvation means a process is continually denied access to resources it needs.","kind":"single"},{"id":18,"round":1,"tag":"Operating System","difficulty":"Medium","question":"Select ALL THREE activities normally carried out by an operating system.","choices":["Allocating memory to processes","Maintaining files and folders","Scheduling CPU time","Translating assembly source into machine code"],"correct":[0,1,2],"why":"Memory management, file management and process scheduling are OS functions. Assembly translation is carried out by an assembler.","kind":"multi"},{"id":19,"round":1,"tag":"RAM","difficulty":"Easy","question":"True or False: RAM is volatile, so it normally loses its contents when power is removed.","choices":["True","False"],"correct":[0],"why":"RAM is volatile working memory. Non-volatile storage retains data without power.","kind":"tf"},{"id":20,"round":1,"tag":"File Extensions","difficulty":"Easy","question":"True or False: Changing a file name from notes.txt to notes.pdf automatically converts it into a valid PDF.","choices":["True","False"],"correct":[1],"why":"Renaming a file extension does not convert the data format. A suitable application must perform the conversion.","kind":"tf"},{"id":21,"round":2,"tag":"Booting","difficulty":"Easy","question":"Which sequence best represents the startup of a typical computer?","choices":["Application → operating system → firmware","Firmware → operating system → application","Operating system → BIOS → electricity","Printer driver → application → firmware"],"correct":[1],"why":"Firmware begins the startup process, the OS loads, and applications can then run.","kind":"single"},{"id":22,"round":2,"tag":"Firmware","difficulty":"Easy","question":"Where is the BIOS/UEFI firmware normally stored so it remains available when the computer is switched off?","choices":["Volatile RAM","CPU accumulator only","Non-volatile flash memory","Printer output buffer"],"correct":[2],"why":"Modern motherboard firmware is typically stored in non-volatile flash memory.","kind":"single"},{"id":23,"round":2,"tag":"CMOS","difficulty":"Easy","question":"On a traditional BIOS computer, which component helps preserve real-time clock operation while main power is off?","choices":["Motherboard battery","Mouse driver","RAM module","Compiler"],"correct":[0],"why":"The motherboard battery maintains the real-time clock and traditionally some CMOS settings.","kind":"single"},{"id":24,"round":2,"tag":"Running Applications","difficulty":"Easy","question":"When you open an installed game, why does the operating system load required code and data into RAM?","choices":["To permanently delete the game from SSD","To make the game become firmware","To convert RAM into secondary storage","So the CPU can access instructions and working data during execution"],"correct":[3],"why":"Running programs use RAM for instructions and data needed during execution.","kind":"single"},{"id":25,"round":2,"tag":"Interrupts","difficulty":"Easy","question":"A printer signals that it has run out of paper. What type of interrupt can this generate?","choices":["Software compilation","Hardware interrupt","Source-code comment","Machine-code translation"],"correct":[1],"why":"A hardware device may send an interrupt request to notify the CPU that attention is needed.","kind":"single"},{"id":26,"round":2,"tag":"Exceptions","difficulty":"Easy","question":"A program executes an invalid arithmetic operation. Which event may be generated by the processor?","choices":["GUI icon","Defragmentation pass","Processor exception","Backup copy"],"correct":[2],"why":"Invalid arithmetic operations, such as an integer divide by zero, may cause a processor exception.","kind":"single"},{"id":27,"round":2,"tag":"ISR","difficulty":"Easy","question":"What is the purpose of an Interrupt Service Routine (ISR)?","choices":["To handle a particular interrupt","To compile Python programs","To store files permanently","To replace the motherboard"],"correct":[0],"why":"An ISR is a set of instructions executed to respond to a particular interrupt.","kind":"single"},{"id":28,"round":2,"tag":"CPU State","difficulty":"Easy","question":"Why must the CPU preserve its current state when it services an interrupt?","choices":["To make RAM non-volatile","To create a PDF file","To add more cores to the CPU","So it can correctly resume the interrupted task"],"correct":[3],"why":"Saving registers, the program counter and other needed state allows execution to continue correctly afterward.","kind":"single"},{"id":29,"round":2,"tag":"Interrupt Priority","difficulty":"Easy","question":"A system receives several interrupt requests. How does it decide which pending request to handle first?","choices":["Alphabetical order of device names","Interrupt priority and system rules","Whichever device is physically largest","Which program has the shortest filename"],"correct":[1],"why":"The interrupt controller/CPU uses priorities and masking rules to determine which requests are accepted and serviced.","kind":"single"},{"id":30,"round":2,"tag":"Buffers and Interrupts","difficulty":"Easy","question":"The printer buffer becomes empty while pages remain to be printed. Why might the printer generate an interrupt?","choices":["To erase all documents","To start a new user account","To request that more print data be supplied","To turn assembly into Python"],"correct":[2],"why":"An interrupt can request more data so printing can continue.","kind":"single"},{"id":31,"round":2,"tag":"CPU Operations","difficulty":"Medium","question":"Select ALL THREE actions associated with a typical accepted interrupt.","choices":["Save relevant CPU state","Run an interrupt service routine","Restore saved state before resuming","Delete the original program from storage"],"correct":[0,1,2],"why":"A typical interrupt sequence saves state, executes an ISR, and restores state so the interrupted process can continue.","kind":"multi"},{"id":32,"round":2,"tag":"High-Level Languages","difficulty":"Easy","question":"Why are high-level programming languages generally easier for programmers to use?","choices":["They use readable statements and hide many hardware details","They can only run on one exact CPU model","They consist entirely of binary digits","They never need translation"],"correct":[0],"why":"High-level languages use more human-readable instructions and abstract many hardware details.","kind":"single"},{"id":33,"round":2,"tag":"Machine Code","difficulty":"Easy","question":"Which language can the processor execute directly as its native instructions?","choices":["Python source code","A pseudocode algorithm","An English recipe","Machine code for its instruction set"],"correct":[3],"why":"A CPU directly executes machine instructions designed for its architecture.","kind":"single"},{"id":34,"round":2,"tag":"Assembly Language","difficulty":"Easy","question":"What are mnemonics in assembly language?","choices":["Names of operating systems","Short symbolic instruction names such as ADD","Hardware sockets on the motherboard","Large temporary files in RAM"],"correct":[1],"why":"Mnemonics are symbolic names for processor-specific instructions, such as ADD and SUB.","kind":"single"},{"id":35,"round":2,"tag":"Assembler","difficulty":"Easy","question":"Which source language does an assembler translate?","choices":["Python source only","Java source only","Assembly language","SQL queries"],"correct":[2],"why":"An assembler translates assembly-language instructions into machine code.","kind":"single"},{"id":36,"round":2,"tag":"Compiler","difficulty":"Easy","question":"In the simplified IGCSE model, what is the main role of a compiler?","choices":["Translate the complete high-level source program into machine-code output","Execute source one statement at a time without an executable","Manage user account passwords","Assign CPU time to apps"],"correct":[0],"why":"A compiler translates the whole source program and produces object code or an executable through the build process.","kind":"single"},{"id":37,"round":2,"tag":"Interpreter","difficulty":"Easy","question":"What best describes the operation of an interpreter in the IGCSE model?","choices":["It only manages printer data","It replaces RAM with ROM","It permanently creates the CPU instruction set","It translates and executes program statements in turn"],"correct":[3],"why":"An interpreter works through source statements and executes them without normally creating a standalone machine-code executable.","kind":"single"},{"id":38,"round":2,"tag":"Translators","difficulty":"Easy","question":"A game has already been compiled into a suitable executable. True or False: The user must run the compiler every time they launch that unchanged executable.","choices":["True","False"],"correct":[1],"why":"Once a compiled executable is built, users generally run it without needing the compiler.","kind":"tf"},{"id":39,"round":2,"tag":"Assembly Language","difficulty":"Easy","question":"True or False: Assembly language is machine-dependent because its instructions relate to a particular processor architecture.","choices":["True","False"],"correct":[0],"why":"Different CPU architectures use different registers and instruction sets, so assembly is processor-specific.","kind":"tf"},{"id":40,"round":2,"tag":"Translator Comparison","difficulty":"Hard","question":"Which pairing is accurate?","choices":["Compiler — assembly only; assembler — Python only","Interpreter — creates a permanent standalone executable by default","Compiler — whole high-level program; assembler — assembly language","Assembler — GUI management; compiler — file management"],"correct":[2],"why":"A compiler translates high-level source while an assembler translates assembly-language source.","kind":"single"},{"id":41,"round":3,"tag":"IDE Basics","difficulty":"Easy","question":"What is the primary purpose of an Integrated Development Environment (IDE)?","choices":["Organise network cables","Help programmers write, run, test and debug software","Replace CPU hardware","Store documents only"],"correct":[1],"why":"An IDE combines tools that support software development, including editing, running and debugging code.","kind":"single"},{"id":42,"round":3,"tag":"Code Editor","difficulty":"Easy","question":"A student opens a Python file and changes several lines without using another application. Which IDE feature is being used?","choices":["File defragmenter","BIOS settings","Code editor","Hardware interrupt"],"correct":[2],"why":"The code editor is the area where source code can be written and edited.","kind":"single"},{"id":43,"round":3,"tag":"Auto-completion","difficulty":"Easy","question":"When a student types `pri`, the editor suggests `print`. Which IDE feature is this?","choices":["Auto-completion","Compiler optimisation","Memory paging","Error logging"],"correct":[0],"why":"Auto-completion suggests language keywords and identifiers while the programmer types.","kind":"single"},{"id":44,"round":3,"tag":"Auto-correction","difficulty":"Easy","question":"The IDE identifies a minor coding issue and offers an automatic fix. Which feature is this?","choices":["Device driver","Virtual memory","Print buffering","Auto-correction"],"correct":[3],"why":"Auto-correction or a quick fix can suggest and sometimes apply changes to code.","kind":"single"},{"id":45,"round":3,"tag":"Prettyprinting","difficulty":"Easy","question":"An editor adds sensible indentation and syntax colours to make Python code more readable. Which feature does this illustrate?","choices":["Bootstrapping","Prettyprinting","CPU scheduling","Machine-code execution"],"correct":[1],"why":"Prettyprinting improves the presentation of code through formatting, layout and/or highlighting.","kind":"single"},{"id":46,"round":3,"tag":"Error Diagnostics","difficulty":"Easy","question":"A student forgets the colon after a Python `if` statement. What IDE feature helps identify the syntax error?","choices":["User account management","Backup software","Error diagnostics","Disk defragmenter"],"correct":[2],"why":"Error diagnostics detect and report possible coding errors and may highlight their locations.","kind":"single"},{"id":47,"round":3,"tag":"Debugger","difficulty":"Easy","question":"A programmer runs code one step at a time and examines the changing value of a variable. Which IDE tool is best suited?","choices":["Debugger","Firewall","File compressor","Assembler"],"correct":[0],"why":"A debugger can step through execution and inspect variable values to help locate bugs.","kind":"single"},{"id":48,"round":3,"tag":"IDE Translator","difficulty":"Easy","question":"Which statement accurately describes the translator feature in an IDE?","choices":["It turns images into sound","It increases the CPU clock frequency","It changes a user password","It helps convert source code into instructions that can be executed"],"correct":[3],"why":"An IDE may integrate a compiler or interpreter so code can be executed or built.","kind":"single"},{"id":49,"round":3,"tag":"Auto-documenter","difficulty":"Medium","question":"A tool automatically generates documentation based on code and comments. What IDE feature is being used?","choices":["Memory management","Auto-documenter","Print spooler","Interrupt priority"],"correct":[1],"why":"An auto-documenter generates or assists in creating documentation for program elements.","kind":"single"},{"id":50,"round":3,"tag":"IDE Scenario","difficulty":"Medium","question":"A student uses a Python IDE to develop a program. Select ALL THREE useful IDE actions from the list.","choices":["Suggesting a function name during typing","Highlighting the location of a syntax error","Stepping through code to inspect variables","Physically adding another RAM chip to the motherboard"],"correct":[0,1,2],"why":"Auto-completion, error diagnostics and debugging are IDE development features. An IDE cannot physically install RAM.","kind":"multi"}];

const answeredRound=n=>qByRound(n).filter(answered).length;
const scoreRound=n=>qByRound(n).filter(correct).length;
const answeredTotal=()=>QUESTIONS.filter(answered).length;
const scoreTotal=()=>QUESTIONS.filter(correct).length;

function badgeRound(r){return r===1?'01':r===2?'02':'03'}
function percentage(n,total){return total?Math.round(100*n/total):0}
function setView(view,round=state.round,position=state.position){state.view=view;state.round=Number(round);state.position=Number(position);save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
 document.getElementById('globalStatus').textContent=`★ ${answeredTotal()} / 50 answered`;
 const app=document.getElementById('app');
 if(state.view==='quiz')app.innerHTML=renderQuiz();
 else if(state.view==='roundResult')app.innerHTML=renderRoundResult();
 else if(state.view==='results')app.innerHTML=renderResults();
 else app.innerHTML=renderHome();
}
function renderHome(){return `<section class="hero"><div><span class="eyebrow"><span class="dot"></span> Cambridge IGCSE 0478 · Secondary 3</span><h1>Learn. Play.<br><span>Master Software.</span></h1><p>50 colourful, exam-style questions across three rounds. Test your knowledge, check each answer, and grow your confidence!</p><div class="stat-row"><span class="stat">50 <span>Questions</span></span><span class="stat">3 <span>Rounds</span></span><span class="stat">✓ <span>Instant feedback</span></span></div></div><div class="hero-image">${art(4)}</div></section>
  <div class="section-head"><div><h2>Choose your round</h2><p>Answer at your own pace. Your progress saves automatically on this device.</p></div><button class="btn outline" data-action="results">📊 My results</button></div>
  <div class="intro-grid">${ROUNDS.map(r=>{let arr=qByRound(r.id);let a=answeredRound(r.id);return `<button class="panel round-card" data-action="round" data-round="${r.id}" aria-label="Open ${r.label}, ${r.title}"><div class="round-illu">${art(r.id===1?1:r.id===2?2:4)}</div><div class="round-top"><span class="mini-pill" style="background:${r.color}16;color:${r.color}">${r.label.toUpperCase()}</span><span class="mini-pill">${arr.length} questions</span></div><h3>${r.title}</h3><p>${r.detail}</p><div class="mini-progress"><span style="width:${percentage(a,arr.length)}%"></span></div><div class="round-cta"><span>${a===arr.length?'Review round':a?'Continue round':'Start learning'}</span><span aria-hidden="true">➜</span></div></button>`}).join('')}</div>
  <div class="section-head"><div><h2>Student details</h2><p>Optional — your name and class can appear on your results sheet.</p></div></div>
  <div class="panel student-form"><div class="field"><label for="studentName">Student name</label><input id="studentName" placeholder="Enter your name" value="${enc(state.name)}" maxlength="90" autocomplete="name"></div><div class="field"><label for="studentClass">Class</label><input id="studentClass" placeholder="e.g. Secondary 3B1" value="${enc(state.className)}" maxlength="45"></div><button class="btn primary" data-action="round" data-round="1">${answeredRound(1)?'Continue Round 1':'Start Round 1'} →</button></div>
  <p class="note">🔒 No login, external images, advertisements, or internet connection required after loading this file. Quiz progress is stored only in this browser. To share scores, students can download their results as CSV.</p>`}
function renderQuiz(){const round=state.round;const qs=qByRound(round);const index=Math.max(0,Math.min(state.position,qs.length-1));state.position=index;const q=qs[index];const ans=state.selections[q.id]||[];const done=answered(q);const good=correct(q);const response=q.correct.map(i=>q.choices[i]).join(' + ');const r=ROUNDS[round-1];const roundCount=answeredRound(round);return `
<div class="quiz-top"><div class="bread"><button class="btn outline" data-action="home" style="min-height:39px;padding:7px 12px">← Home</button> &nbsp; <b>${r.label}: ${r.title}</b></div><div class="stat-row"><span class="stat">${scoreRound(round)} <span>correct</span></span><span class="stat">${roundCount}/${qs.length} <span>answered</span></span></div></div>
<div class="quiz-layout"><section class="panel question-panel"><div class="question-progress"><span>QUESTION ${index+1} OF ${qs.length}</span><span>${percentage(roundCount,qs.length)}% answered</span></div><div class="bar"><span style="width:${percentage(roundCount,qs.length)}%"></span></div><div class="chips"><span class="chip">${enc(q.tag)}</span><span class="chip difficulty">${q.difficulty}</span>${q.kind==='multi'?'<span class="chip" style="background:#eafbf2;color:#148b74">Select all correct answers</span>':''}</div><h2>${enc(q.question)}</h2><p class="choose-help">${q.kind==='multi'?'Select every correct option, then check your answer.':'Select one answer, then check it.'}</p>
<div class="answers" role="group" aria-label="Answer choices">${q.choices.map((label,i)=>{let picked=(done?state.submitted[q.id]:ans).includes(i),isc=q.correct.includes(i);let cl=done?(isc?'correct':picked?'wrong':''):picked?'sel':'';return `<button class="answer ${cl}" data-action="select" data-choice="${i}" ${done?'disabled':''} aria-pressed="${picked}"><span class="letter">${q.kind==='tf'?(i===0?'T':'F'):iconName[i]}</span><span>${enc(label)}</span>${done&&isc?'<span style="margin-left:auto;color:#139976;font-size:20px" aria-label="correct">✓</span>':''}</button>`}).join('')}</div>
${!done&&state.hints[q.id]?`<div class="hint">💡 Think carefully about the role of <strong>${enc(q.tag.toLowerCase())}</strong> in a computer system.</div>`:''}
${done?`<div class="response ${good?'':'bad'}" role="status"><div class="response-title">${good?'🎉 Correct answer!':'💡 Let’s learn from this one'}</div><p><b>Answer:</b> ${enc(response)}.</p><p>${enc(q.why)}</p></div>`:''}
<div class="question-actions"><div class="left-actions"><button class="btn outline" data-action="prev" ${index===0?'disabled':''}>← Previous</button>${done?'':`<button class="btn secondary" data-action="hint">${state.hints[q.id]?'Hide hint':'💡 Hint'}</button>`}</div><div class="left-actions">${done?`<button class="btn primary" data-action="next">${index===qs.length-1?'View round score →':'Next question →'}</button>`:`<button class="btn primary" data-action="check" ${ans.length===0?'disabled':''}>✓ Check answer</button>`}</div></div></section>
<aside class="panel side-panel"><div class="side-image">${art(round===1?1:round===2?(q.id>31?3:2):4)}</div><h3>${r.label}: Question map</h3><p>Tap any number to jump to that question. Green = correct, pink = needs review.</p><div class="number-grid">${qs.map((item,i)=>`<button data-action="jump" data-position="${i}" class="${i===index?'current':answered(item)?correct(item)?'done':'wrongnum':''}" aria-label="Question ${i+1}${answered(item)?correct(item)?', correct':', incorrect':', not yet answered'}" ${i===index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="legend"><span><b></b>Correct</span><span class="pending"><b></b>Not answered</span></div><div style="margin-top:21px;display:grid;gap:9px"><button class="btn secondary" data-action="roundResult">📊 Round results</button><button class="btn outline" data-action="results">🏆 Overall results</button></div></aside></div>`}
function donut(score,total){let pct=percentage(score,total);return `<div class="score-ring" style="--percent:${pct}%" aria-label="Score ${score} out of ${total}"><span>${pct}%</span></div>`}
function renderRoundResult(){let r=state.round,qs=qByRound(r),sc=scoreRound(r),a=answeredRound(r),missing=qs.length-a;return `<div class="panel result-hero"><span class="eyebrow"><span class="dot"></span> ROUND ${r} RESULTS</span>${donut(sc,qs.length)}<h2>${sc} out of ${qs.length} correct</h2><p>${missing?`${missing} question${missing>1?'s':''} not yet answered. You can return and complete them.`:sc===qs.length?'Excellent! A perfect round!':'Nice effort. Review the explanations and try the next round.'}</p><div class="result-actions"><button class="btn outline" data-action="round" data-round="${r}">← Review questions</button>${r<3?`<button class="btn primary" data-action="round" data-round="${r+1}">Start Round ${r+1} →</button>`:`<button class="btn primary" data-action="results">Final results →</button>`}<button class="btn secondary" data-action="home">🏠 Home</button></div></div><div class="section-head"><div><h2>Round breakdown</h2><p>Correct answers are highlighted, and you can revisit any question.</p></div></div><div class="review-list">${qs.map((q,i)=>`<div class="review-card"><span class="status ${correct(q)?'':'no'}">${!answered(q)?'Not answered':correct(q)?'✓ Correct':'✕ Review'}</span><h4>${i+1}. ${enc(q.question)}</h4><small>${enc(q.tag)} · ${answered(q)?`Correct answer: ${enc(q.correct.map(n=>q.choices[n]).join(' + '))}`:'Open this question to try it'}</small><div style="margin-top:8px"><button class="btn outline" data-action="jumpRound" data-round="${r}" data-position="${i}" style="min-height:34px;padding:6px 12px;font-size:12px">Open question →</button></div></div>`).join('')}</div>`}
function renderResults(){let a=answeredTotal(),sc=scoreTotal(),missing=50-a, student=state.name?enc(state.name):'Student';return `<div class="panel result-hero"><span class="eyebrow"><span class="dot"></span> YOUR OVERALL SCORE</span>${donut(sc,50)}<h2>${student}, you've scored ${sc} / 50</h2><p>${missing?`You've answered ${a} of 50 questions. There are ${missing} still to attempt.`:'You completed all 50 Software Unit questions. Well done!'}</p><div class="result-actions"><button class="btn primary" data-action="export">⬇ Download results (CSV)</button><button class="btn outline" data-action="home">🏠 Back to rounds</button><button class="btn danger" data-action="reset">↻ Start over</button></div></div><div class="section-head"><div><h2>Your progress by round</h2><p>Each question carries one mark. Multiple-answer questions require all correct choices.</p></div></div><div class="result-grid">${ROUNDS.map(r=>`<div class="panel"><div class="round-top"><span class="mini-pill">${r.label}</span><span class="mini-pill">${answeredRound(r.id)}/${qByRound(r.id).length} answered</span></div><div style="margin:11px 0"><b style="color:${r.color}">${scoreRound(r.id)} / ${qByRound(r.id).length}</b></div><p>${r.title}</p><div class="mini-progress" style="margin:13px 0"><span style="width:${percentage(answeredRound(r.id),qByRound(r.id).length)}%"></span></div><button class="btn outline" data-action="round" data-round="${r.id}" style="width:100%;padding:8px">Review ${r.label} →</button></div>`).join('')}</div><p class="note">Your responses are stored only in this browser. The downloaded CSV can be shared with your teacher if requested.</p>`}
function csvEscape(t){const s=String(t??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){let rows=[['Student Name','Class','Question','Round','Topic','Difficulty','Question Text','Student Answer','Correct Answer','Mark']];QUESTIONS.forEach(q=>{let submitted=state.submitted[q.id];rows.push([state.name,state.className,q.id,q.round,q.tag,q.difficulty,q.question,submitted?submitted.map(i=>q.choices[i]).join(' + '):'[Not answered]',q.correct.map(i=>q.choices[i]).join(' + '),correct(q)?1:0])});rows.push(['TOTAL','','','','','','','','',scoreTotal()]);let content='\ufeff'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n');let b=new Blob([content],{type:'text/csv;charset=utf-8;'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='software-quiz-'+(state.name||'student').replace(/[^a-z0-9_-]/gi,'_')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const app=document.getElementById('app');
document.getElementById('brandHome').addEventListener('click',e=>{e.preventDefault();setView('home')});
app.addEventListener('input',e=>{if(e.target.id==='studentName')state.name=e.target.value;if(e.target.id==='studentClass')state.className=e.target.value;save()});
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
if(action==='home')setView('home');
else if(action==='results')setView('results');
else if(action==='round'||action==='jumpRound'){let r=Number(b.dataset.round),qs=qByRound(r);let pos=action==='jumpRound'?Number(b.dataset.position):qs.findIndex(q=>!answered(q));setView('quiz',r,pos<0?0:pos)}
else if(action==='jump')setView('quiz',state.round,Number(b.dataset.position));
else if(action==='prev')setView('quiz',state.round,Math.max(0,state.position-1));
else if(action==='next'){let qs=qByRound(state.round);if(state.position>=qs.length-1)setView('roundResult');else setView('quiz',state.round,state.position+1)}
else if(action==='hint'){let q=qByRound(state.round)[state.position];state.hints[q.id]=!state.hints[q.id];save();render()}
else if(action==='select'){let q=qByRound(state.round)[state.position];if(answered(q))return;let v=Number(b.dataset.choice);let arr=state.selections[q.id]||[];state.selections[q.id]=q.kind==='multi'?(arr.includes(v)?arr.filter(x=>x!==v):[...arr,v].sort()):[v];save();render()}
else if(action==='check'){let q=qByRound(state.round)[state.position];let sel=state.selections[q.id]||[];if(!answered(q)&&sel.length){state.submitted[q.id]=[...sel];save();render()}}
else if(action==='roundResult')setView('roundResult');
else if(action==='export')exportCSV();
else if(action==='reset'){if(confirm('Clear all your quiz answers and start again?')){const name=state.name,className=state.className;state=defaultState();state.name=name;state.className=className;save();render()}}
});
render();
</script>
</body>
</html>
